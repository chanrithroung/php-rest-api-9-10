<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Data View</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background-color: #4f46e5;
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .refresh-button {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .refresh-button:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f9fafb;
            font-weight: 600;
            color: #666;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .price {
            font-weight: 600;
            color: #4f46e5;
        }

        .date {
            color: #666;
        }

        /* Action buttons */
        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            background-color: transparent;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .edit-btn {
            color: #4f46e5;
        }

        .edit-btn:hover {
            background-color: rgba(79, 70, 229, 0.1);
        }

        .delete-btn {
            color: #ef4444;
        }

        .delete-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        .save-btn {
            color: #10b981;
        }

        .save-btn:hover {
            background-color: rgba(16, 185, 129, 0.1);
        }

        .cancel-btn {
            color: #6b7280;
        }

        .cancel-btn:hover {
            background-color: rgba(107, 114, 128, 0.1);
        }

        /* Inline editing */
        .edit-input {
            width: 100%;
            padding: 4px 8px;
            border: 1px solid #4f46e5;
            border-radius: 4px;
            font-size: 0.875rem;
            background-color: white;
        }

        .edit-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }

        /* Form styles */
        .form-container {
            padding: 20px;
            background-color: #f9fafb;
            border-bottom: 1px solid #eee;
        }

        .form-title {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #333;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: #4f46e5;
            outline: none;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }

        .form-button {
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 16px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .form-button:hover:not(:disabled) {
            background-color: #4338ca;
        }

        .form-button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        /* Pagination styles */
        .pagination-container {
            padding: 20px;
            background-color: #f9fafb;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .pagination-info {
            color: #666;
            font-size: 0.875rem;
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pagination-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            background-color: white;
            color: #333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .pagination-btn:hover:not(.disabled) {
            background-color: #f3f4f6;
            border-color: #4f46e5;
        }

        .pagination-btn.active {
            background-color: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .pagination-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-btn.page-btn {
            min-width: 40px;
            justify-content: center;
        }

        .pagination-ellipsis {
            padding: 8px 4px;
            color: #666;
            font-size: 0.875rem;
        }

        /* Loading state */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
            
            .header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .pagination-container {
                flex-direction: column;
                text-align: center;
            }

            .pagination-controls {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            /* Convert to a card-like display on mobile */
            table, thead, tbody, th, td, tr {
                display: block;
            }
            
            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }
            
            tr {
                margin-bottom: 15px;
                border-bottom: 2px solid #eee;
                padding: 10px;
            }
            
            td {
                border: none;
                position: relative;
                padding-left: 50%;
                text-align: right;
                padding-top: 8px;
                padding-bottom: 8px;
            }
            
            td:before {
                position: absolute;
                top: 8px;
                left: 16px;
                width: 45%;
                padding-right: 10px;
                white-space: nowrap;
                text-align: left;
                font-weight: 600;
                color: #666;
            }
            
            /* Add labels for mobile view */
            td:nth-of-type(1):before { content: "ID"; }
            td:nth-of-type(2):before { content: "Title"; }
            td:nth-of-type(3):before { content: "Price"; }
            td:nth-of-type(4):before { content: "Created At"; }
            td:nth-of-type(5):before { content: "Actions"; }
            
            .actions {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Product Data</h1>
            <button class="refresh-button" onclick="refreshProducts()">Refresh</button>
        </div>
        
        <!-- Add Form -->
        <div class="form-container">
            <h2 class="form-title">Add New Product</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" id="title" name="title" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="price" class="form-label">Price</label>
                    <input type="number" id="price" name="price" class="form-input" min="0" step="0.01" required>
                </div>
                <button type="submit" class="form-button">Add Product</button>
            </form>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="rows">
                <!-- Table rows will be added here by JavaScript -->
            </tbody>
        </table>

        <!-- Pagination -->
        <div class="pagination-container" id="pagination">
            <!-- Pagination controls will be added here by JavaScript -->
        </div>
    </div>
    <script src="stores.js"></script>
</body>
</html>
